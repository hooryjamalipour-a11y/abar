<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>کاراکتر واقعیت افزوده — v2.1.1</title>
<style>
:root{--mint:#42d6c5;--dark:#101820}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{border:0;border-radius:14px;padding:14px 20px;background:var(--mint);color:#062a2c;font-weight:800;font-size:16px}#start{display:none!important}#status{display:none!important;position:fixed;z-index:5;top:env(safe-area-inset-top,10px);left:12px;right:12px;text-align:center;background:#0009;border:1px solid #ffffff1c;border-radius:13px;padding:10px 12px;font-size:13px;pointer-events:none;text-shadow:0 1px 5px #000}#cam,#fallbackCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#cam{display:none}#fallbackCanvas{display:none}#arCanvas{position:fixed;inset:0;z-index:2;pointer-events:none}#actions{position:fixed;z-index:6;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;justify-content:center;gap:8px}#actions button{font-size:13px;padding:11px 13px}#again,#hide{display:none;background:#102d31eF;color:#fff;border:1px solid #42d6c588}#soundUnlock{display:none;position:fixed;z-index:9;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:auto;max-width:90vw;height:44px;padding:0 14px;border-radius:22px;font-size:14px;background:#102d31dd;color:#fff;border:1px solid #42d6c588}#fallbackNote{position:fixed;z-index:4;bottom:85px;left:12px;right:12px;text-align:center;font-size:11px;color:#fff9;text-shadow:0 1px 4px #000;pointer-events:none}video{display:none}canvas{display:block} .hidden{display:none!important}
</style>
</head>
<body>
<div id="start" class="hidden"></div>
<div id="status" class="hidden"></div>
<video id="clip" src="character-green-screen.mp4" playsinline preload="auto" crossorigin="anonymous"></video>
<video id="cam" playsinline autoplay muted></video><canvas id="fallbackCanvas"></canvas><div id="arCanvas"></div>
<div id="fallbackNote" class="hidden"></div><button id="soundUnlock" aria-label="فعال‌کردن صدا">برای پخش صدا لمس کن 🔊</button><div id="actions"><button id="again">پخش دوباره</button><button id="hide">محو کردن</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const $=id=>document.getElementById(id), clip=$('clip'), status=$('status');
let renderer,scene,camera,actor,hitSource=null,hitRequested=false,placed=false,fadeAt=0,mode='none',stream=null,canvasCtx=null,canvasRAF=0,arStartedAt=0;
const TARGET_HEIGHT=2.625; // 1.5 x 1.75 m reference person
const setStatus=t=>status.textContent=t;
function chromaDraw(ctx,source,w,h){
 ctx.drawImage(source,0,0,w,h);const im=ctx.getImageData(0,0,w,h),d=im.data;
 // Remove saturated green; feather the edge to avoid a hard halo.
 for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const green=Math.min(1,Math.max(0,(g-Math.max(r,b)-12)/70));const sat=Math.max(0,g-Math.max(r,b));const a=1-Math.min(1,green*(sat>35?1: sat/35));d[i+3]=Math.round(d[i+3]*a);}
 ctx.putImageData(im,0,0);
}
function startFallback(){
 mode='fallback';const cam=$('cam'),canvas=$('fallbackCanvas');cam.style.display='block';canvas.style.display='block';canvas.width=360;canvas.height=640;canvasCtx=canvas.getContext('2d',{willReadFrequently:true});$('fallbackNote').textContent='';
 const draw=()=>{if(mode!=='fallback')return;const w=canvas.width,h=canvas.height;canvasCtx.clearRect(0,0,w,h);if(cam.readyState>=2){canvasCtx.drawImage(cam,0,0,w,h);}// Draw keyed character using a small offscreen canvas to preserve camera behind transparent pixels.
 if(clip.readyState>=2){const ar=clip.videoWidth/clip.videoHeight;const hh=h*.68,ww=hh*ar;let off=draw.off;if(!off){off=document.createElement('canvas');draw.off=off;off.width=360;off.height=640;draw.offctx=off.getContext('2d',{willReadFrequently:true});}draw.offctx.clearRect(0,0,360,640);draw.offctx.drawImage(clip,0,0,360,640);const im=draw.offctx.getImageData(0,0,360,640),d=im.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const excess=g-Math.max(r,b);let alpha=1-Math.max(0,Math.min(1,(excess-10)/75));if(g>150&&g>r*1.25&&g>b*1.2)alpha*=0.03;d[i+3]=Math.round(d[i+3]*alpha);}draw.offctx.putImageData(im,0,0);canvasCtx.drawImage(off,(w-ww)/2,(h-hh)*.52,ww,hh);}
 canvasRAF=requestAnimationFrame(draw);};
 cam.addEventListener('loadedmetadata',()=>{canvas.width=cam.videoWidth||360;canvas.height=cam.videoHeight||640;},{once:true});draw();
 clip.currentTime=0;clip.play().then(()=>setStatus('')).catch(()=>setStatus(''));
}
function makeActor(){
 const tex=new THREE.VideoTexture(clip);tex.colorSpace=THREE.SRGBColorSpace;tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;
 const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{map:{value:tex},opacity:{value:1}},vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform sampler2D map;uniform float opacity;varying vec2 vUv;void main(){vec4 c=texture2D(map,vUv);float green=max(0.0,c.g-max(c.r,c.b));float a=1.0-smoothstep(0.10,0.42,green);if(c.g>0.58&&c.g>c.r*1.25&&c.g>c.b*1.25)a*=0.02;gl_FragColor=vec4(c.rgb,a*opacity);if(gl_FragColor.a<0.02)discard;}' });
 const h=TARGET_HEIGHT,w=h*(360/640);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);const g=new THREE.Group();g.add(m);g.userData.mat=mat;g.visible=false;return g;
}
async function startAR(){
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera();renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');$('arCanvas').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x777788,2));actor=makeActor();scene.add(actor);
 const session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});await renderer.xr.setSession(session);mode='ar';$('start').style.display='none';$('again').style.display='block';$('hide').style.display='block';setStatus('دوربین فعال شد؛ سطح را خودکار پیدا می‌کنیم…');
 renderer.setAnimationLoop((time,frame)=>{if(frame){const s=renderer.xr.getSession();const ref=renderer.xr.getReferenceSpace();if(!hitRequested){hitRequested=true;s.requestReferenceSpace('viewer').then(v=>s.requestHitTestSource({space:v})).then(x=>hitSource=x).catch(()=>{setStatus('ردیابی سطح در دسترس نیست؛ حالت دوربین فعال می‌شود.');});}if(hitSource&&!placed){const hits=frame.getHitTestResults(hitSource);if(hits.length){const pose=hits[0].getPose(ref);if(pose){actor.position.setFromMatrixPosition(new THREE.Matrix4().fromArray(pose.transform.matrix));actor.quaternion.setFromRotationMatrix(new THREE.Matrix4().fromArray(pose.transform.matrix));actor.position.y+=TARGET_HEIGHT/2;actor.visible=true;placed=true;clip.currentTime=0;clip.muted=false;clip.play().catch(()=>{clip.muted=true;$('soundUnlock').style.display='block';});}}}if(fadeAt){const p=Math.min(1,(time-fadeAt)/1100);actor.userData.mat.uniforms.opacity.value=1-p;if(p>=1){actor.visible=false;fadeAt=0;}}}renderer.render(scene,camera);});
 session.addEventListener('end',()=>{if(mode==='ar')setStatus('جلسهٔ AR پایان یافت.');});
}
let audioUnlocked=false, arAttempted=false;
async function playClipWithSound(){
 clip.loop=false;clip.playsInline=true;clip.muted=false;clip.volume=1;clip.currentTime=0;
 try { await clip.play(); audioUnlocked=true; $('soundUnlock').style.display='none'; }
 catch(e) { clip.muted=true; try{await clip.play();}catch(_){} $('soundUnlock').style.display='block'; }
}
async function startCamera(){
 try {
   // Ask for camera access immediately; the browser itself handles its permission prompt.
   stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1920}}});
   $('cam').srcObject=stream; await $('cam').play();
   $('again').style.display='block'; $('hide').style.display='block';
   startFallback();
   // Try audible autoplay. Mobile browsers may block sound until the first user gesture.
   await playClipWithSound();
 } catch(e) {
   console.error(e);
   // No custom splash/error text over the camera; keep the browser-native permission prompt/error behavior.
 }
}
async function tryARFromGesture(){
 if(arAttempted || !navigator.xr) return;
 arAttempted=true;
 try {
   if(await navigator.xr.isSessionSupported('immersive-ar')) {
     if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
     cancelAnimationFrame(canvasRAF);
     $('cam').style.display='none';$('fallbackCanvas').style.display='none';
     await startAR();
   }
 } catch(e) {
   console.warn('AR unavailable; continuing camera fallback',e);
   if(!stream) {
     try { stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});$('cam').srcObject=stream;await $('cam').play();startFallback(); }
     catch(err){console.error(err);}
   }
 }
}
document.addEventListener('pointerdown', async ()=>{
 if(!audioUnlocked && clip.paused===false && clip.muted){ clip.muted=false; try{await clip.play();audioUnlocked=true;$('soundUnlock').style.display='none';}catch(e){clip.muted=true;} }
 tryARFromGesture();
}, {once:true});
$('soundUnlock').addEventListener('click', async (e)=>{e.stopPropagation();clip.muted=false;try{await clip.play();audioUnlocked=true;$('soundUnlock').style.display='none';}catch(err){clip.muted=true;}});

clip.addEventListener('ended',()=>{clip.pause();setStatus('');if(mode==='ar'&&actor?.visible){setTimeout(()=>{if(mode==='ar'&&actor?.visible){fadeAt=performance.now();setStatus('');}},700);}else if(mode==='fallback'){// Leave the final frame visible briefly, then fade the keyed overlay.
 setTimeout(()=>{if(mode==='fallback'){const c=$('fallbackCanvas');c.style.transition='opacity 1.1s';c.style.opacity='0';setTimeout(()=>{c.style.display='none';},1150);}},700);}});
$('again').addEventListener('click',()=>{if(mode==='ar'&&actor){fadeAt=0;actor.visible=true;actor.userData.mat.uniforms.opacity.value=1;}if(mode==='fallback'){$('fallbackCanvas').style.display='block';$('fallbackCanvas').style.opacity='1';}clip.currentTime=0;clip.muted=false;clip.play().catch(()=>{clip.muted=true;$('soundUnlock').style.display='block';});});
$('hide').addEventListener('click',()=>{clip.pause();if(mode==='ar'&&actor)fadeAt=performance.now();else if(mode==='fallback'){$('fallbackCanvas').style.transition='opacity 1.1s';$('fallbackCanvas').style.opacity='0';setTimeout(()=>$('fallbackCanvas').style.display='none',1150);}});
addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());cancelAnimationFrame(canvasRAF);});addEventListener('resize',()=>{if(renderer){renderer.setSize(innerWidth,innerHeight);}});
// Automatically request camera access on page load. Native browser permission UI is shown by the browser.
startCamera();
</script>
</body></html>
